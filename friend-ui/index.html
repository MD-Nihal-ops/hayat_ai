 if(R.r==='map'){const q=new URLSearchParams(location.hash.split('?')[1]||'');if(q.get('cat')){M.cat=q.get('cat');M.sub='all';history.replaceState(null,'','#/map')}initMap();dragInit()}
 if(R.r==='documents'&&location.hash.includes('upload')){history.replaceState(null,'','#/documents');setTimeout(()=>$('#file')&&$('#file').click(),50)}window.scrollTo(0,0)}
const dragInit=()=>{const h=$('#handle');if(!h)return;h.onpointerdown=e=>{const y0=e.clientY,s0=SHEET;h.setPointerCapture(e.pointerId);h.onpointermove=m=>{SHEET=Math.max(15,Math.min(80,s0+(y0-m.clientY)/innerHeight*100));$('.listcol').style.setProperty('--sh',SHEET+'dvh')};h.onpointerup=()=>{h.onpointermove=null}}};
addEventListener('hashchange',render);
const ics=(d,tm,n)=>{const b=new Blob([`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${n}\nDTSTART:${d.replace(/-/g,'')}T${tm.replace(':','')}00\nEND:VEVENT\nEND:VCALENDAR`],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='appointment.ics';a.click()};
const pop=h=>{const p=$('#pop');if(p.classList.contains('open')&&p.dataset.k===h.k){p.classList.remove('open');return}p.dataset.k=h.k;p.innerHTML=h.html;p.classList.add('open')};
const A={
 avatar(){pop({k:'av',html:`<div class="row" style="padding:8px"><div class="av">${esc(S.name[0])}</div><b>${esc(S.name)}</b></div><a href="#/passport">${ic('id')}My Passport and Care Card</a><a href="#/passport#needs" data-act="needs">${ic('a11y')}Access needs</a><a href="#/privacy">${ic('shield')}Privacy and consent</a><div style="padding:4px 10px"><select id="langsel" aria-label="Language">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${S.lang===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="mi" data-act="theme">${ic('sun')}Theme: ${S.theme==='dark'?'Dark':'Light'}</button><button class="mi" data-act="a11y">${ic('a11y')}Text size and Accessibility</button><a href="#/settings">${ic('gear')}Settings</a><a href="#/about">${ic('info')}About</a><button class="mi" data-act="signout">${ic('out')}Sign out</button>`})},
 needs(){setTimeout(()=>$('#needs')&&$('#needs').scrollIntoView(),100)},
 a11y(){pop({k:'a11y',html:`<h3 style="padding:8px">Accessibility</h3>${[['big','Large text'],['hc','High contrast'],['easy','Easy read'],['rm','Reduce motion']].map(([k,l])=>`<div class="item" style="padding:6px 10px"><span class="fl">${l}</span><label class="sw"><input type="checkbox" data-a11y="${k}" ${S[k]?'checked':''} aria-label="${l}"><span></span></label></div>`).join('')}`})},
 theme(){S.theme=S.theme==='dark'?'light':'dark';save();render()},
 notifs(){modal(`<h2>Notifications</h2>${['Metformin due at 08:00','Appointment with Dr. Layla Hassan on Thursday','Blood test result is ready'].map(x=>`<div class="item"><div class="dot">${ic('bell')}</div>${x}</div>`).join('')}<button class="btn" data-act="close" style="margin-top:12px">Close</button>`)},close:closeM,
 signout(e,ev){ev.preventDefault();S.auth=false;save();location.hash='#/login'},
 uaepass(){S.auth=true;save();toast('Signed in with UAE PASS demo');location.hash='#/home'},
 prompt(e){send(e.dataset.v)},send(){const i=$('#chatin');send(i.value);i.value=''},
 newchat(){if(S.chat.length){S.history.unshift({id:uid(),title:S.chat[0].text.slice(0,40),msgs:S.chat})}S.chat=[];save();drawChat();drawPanel()},
 openhist(e){const h=S.history.find(x=>x.id===e.dataset.id);S.chat=h.msgs;save();drawChat();$('#cpanel').classList.remove('open')},
 ptab(e){document.querySelectorAll('[data-act=ptab]').forEach(b=>b.classList.toggle('on',b===e));drawPanel(e.dataset.v)},drawer(){$('#cpanel').classList.toggle('open')},
 plus(){modal(`<h2>Add to chat</h2><div class="col"><button class="btn" data-act="pickfile">${ic('upload')}Upload a document</button><button class="btn alt" data-act="pickcam">Take a photo</button></div>`)},
 pickfile(){closeM();$('#chatfile').click()},pickcam(){closeM();$('#chatcam').click()},
 mic(){const Rc=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rc)return toast('Voice input is not supported in this browser');const r=new Rc();r.lang={en:'en-US',ar:'ar-AE',hi:'hi-IN',ml:'ml-IN'}[S.lang];r.onresult=ev=>{$('#chatin').value=ev.results[0][0].transcript};r.start();toast('Listening…')},
 copy(e){navigator.clipboard&&navigator.clipboard.writeText(S.chat[e.dataset.i].text);toast('Copied')},speak(e){speak(S.chat[e.dataset.i].text)},speaktext(e){speak(e.dataset.v)},pdf(){print()},print(){print()},
 share(e){const x=S.chat[e.dataset.i].text;navigator.share?navigator.share({text:x}):toast('Sharing is not supported here')},easy(){S.easy=!S.easy;save();render()},
 confirm(e){const c=S.chat[e.dataset.i];c.done=true;S.tasks.push({id:Date.now(),t:'Check on Dad’s medication',done:false});save();drawChat();toast('Task added')},cancelc(e){S.chat[e.dataset.i].done=true;save();drawChat()},
 docchat(e){location.hash='#/ask?q='+encodeURIComponent('Explain my latest document')},
 upload(){$('#file').click()},deldoc(e){S.docs=S.docs.filter(x=>x.id!=e.dataset.id);save();render();toast('Document deleted')},
 mcat(e){M.cat=e.dataset.v;M.sub='all';drawMapUI()},msub(e){M.sub=M.sub===e.dataset.v?'all':e.dataset.v;drawMapUI()},addr(e){M.open[e.dataset.id]=true;drawMapUI()},mapq(e){M.q=e.dataset.v;M.cat='all';location.hash='#/map'},
 locate(){if(!navigator.geolocation)return toast('Location is not available');navigator.geolocation.getCurrentPosition(p=>MAP&&MAP.m.setView([p.coords.latitude,p.coords.longitude],13),()=>toast('Could not get your location'))},
 cancelappt(e){S.appts=S.appts.filter(x=>x.id!=e.dataset.id);save();render();toast('Appointment cancelled')},
 addrem(){const v=$('#rt').value.trim();if(!v)return toast('Enter a reminder');S.rem.push({id:Date.now(),t:v,time:$('#rtm').value,on:true});save();render()},delrem(e){S.rem=S.rem.filter(x=>x.id!=e.dataset.id);save();render()},
 water(e){S.water=Math.max(0,Math.min(8,S.water+ +e.dataset.v));save();render()},
 addins(){const g=i=>$('#i_'+i).value.trim();if(!g('co')||!g('no')||!g('exp'))return toast('Add insurer, policy number and expiry date');S.ins.push({id:Date.now(),co:g('co'),no:g('no'),mem:g('mem')||S.name,exp:g('exp')});save();render();toast('Policy saved')},
 addfam(){modal(`<h2>Add family member</h2><div class="col"><input id="fn" placeholder="Name"><input id="fr" placeholder="Relationship"><input id="fa" type="number" placeholder="Age"><b>Permissions</b><label class="ck"><input type="checkbox" id="p1" checked>See appointments</label><label class="ck"><input type="checkbox" id="p2">See medicines</label><label class="ck"><input type="checkbox" id="p3">See documents</label><label class="ck"><input type="checkbox" id="pc">I confirm this person agrees to be added.</label><button class="btn" data-act="savefam">Save member</button></div>`)},
 savefam(){const n=$('#fn').value.trim();if(!n)return toast('Enter a name');if(!$('#pc').checked)return toast('Please confirm consent');S.family.push({id:Date.now(),n,rel:$('#fr').value||'Family',age:$('#fa').value||'-',care:'No reminders yet'});save();closeM();render();toast('Member added')},
 delfam(e){S.family=S.family.filter(x=>x.id!=e.dataset.id);save();render()},addtask(){const v=$('#newtask').value.trim();if(!v)return;S.tasks.push({id:Date.now(),t:v,done:false});save();render()},
 ev(e){S.jny.ev=e.dataset.v;save();render()},sim(){modal(`<h2>${S.jny.ev} <span class="tag w">Demo</span></h2>${EVENTS[S.jny.ev].map((x,i)=>`<div class="item"><div class="dot">${i+1}</div>${x}</div>`).join('')}<p class="sub">Simulation only. No services were contacted.</p><button class="btn" data-act="close">Close</button>`)},
 mklink(){const g=i=>$('#l_'+i).value;S.links.unshift({id:uid(),type:g('type'),org:g('org'),date:g('date'),time:g('time'),loc:g('loc'),note:g('note')});save();render();toast('Link generated')},
 prevlink(e){modal(linkView(S.links.find(x=>x.id==e.dataset.id))+'<button class="btn ghost" data-act="close">Close</button>')},ics(e){ics(...e.dataset.v.split('|'))},
 editpp(){const p=S.profile;modal(`<h2>Edit passport</h2><div class="col"><input id="e1" value="${esc(p.blood)}" aria-label="Blood type"><input id="e2" value="${esc(p.allergies)}" aria-label="Allergies"><input id="e3" value="${esc(p.contact)}" aria-label="Emergency contact"><input id="e4" value="${esc(p.phone)}" aria-label="Contact phone"><button class="btn" data-act="savepp">Save changes</button></div>`)},
 savepp(){Object.assign(S.profile,{blood:$('#e1').value,allergies:$('#e2').value,contact:$('#e3').value,phone:$('#e4').value});save();closeM();render()},
 savename(){S.name=$('#pname').value.trim()||S.name;save();render();toast('Changes saved')},pwd(){toast('Password change is a placeholder in this demo')},
 export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='hayat-data.json';a.click()},
 wipe(){if(confirm('Delete all your data from this device?')){localStorage.removeItem('hayat2');location.hash='#/login';location.reload()}},reset(){if(confirm('Reset demo data?')){localStorage.removeItem('hayat2');location.reload()}}};
document.addEventListener('click',e=>{const t2=e.target.closest('[data-act]');if(t2&&A[t2.dataset.act])A[t2.dataset.act](t2,e);if(!e.target.closest('#pop')&&!e.target.closest('[data-act=avatar],[data-act=a11y]'))$('#pop').classList.remove('open')});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form,v=id=>($('#'+id)||{}).value||'';
 if(f==='login'){if(v('pw').length<4){const x=$('#err');x.textContent='Enter your email and a password of at least 4 characters.';x.style.display='block';return}S.auth=true;S.email=v('em');if(!localStorage.getItem('hayat2'))S.name=(v('em').split('@')[0]||S.name).replace(/^./,c=>c.toUpperCase());save();location.hash='#/home'}
 if(f==='register'){S.auth=true;S.name=v('rn');S.email=v('em');save();toast('Account created');location.hash='#/home'}
 if(f==='homeask'){if(!v('homeq').trim())return toast('Type a question first');location.hash='#/ask?q='+encodeURIComponent(v('homeq'))}
 if(f==='gsearch'){const q=v('gs').trim();if(q){M.q=q;location.hash='#/map'}}
 if(f==='msearch'){M.q=v('mq');drawMapUI()}});
document.addEventListener('change',e=>{const t2=e.target,d=t2.dataset;
 if(t2.id==='langsel'||t2.id==='langsel2'){S.lang=t2.value;save();render()}
 else if(d.sw){S[d.sw][d.k]=t2.checked;save();if(R.r==='care')render()}
 else if(d.a11y){S[d.a11y]=t2.checked;save();const p=$('#pop').classList.contains('open');render();if(p)A.a11y()}
 else if(d.med){S.meds.find(m=>m.id==d.med).done=t2.checked;save();if(R.r==='home')render();else if(t2.checked)toast('Marked as taken')}
 else if(d.rem){S.rem.find(r=>r.id==d.rem).on=t2.checked;save()}
 else if(d.task){S.tasks.find(k=>k.id==d.task).done=t2.checked;save();render()}
 else if(d.jny){S.jny.done[d.jny.replace('|','|')]=t2.checked;save()}
 else if(d.need){S.profile.needs[d.need]=t2.checked;save()}
 else if(t2.hasAttribute('data-big2')){S.easy=t2.checked;save();render()}
 else if((t2.id==='file'||t2.id==='chatfile'||t2.id==='chatcam')&&t2.files[0]){S.docs.unshift({id:Date.now(),n:t2.files[0].name.replace(/\.[^.]+$/,''),cat:'Medical reports',date:new Date().toISOString().slice(0,10),st:'Uploaded'});save();toast('Document uploaded');if(R.r==='ask')drawPanel('docs');else render()}});
document.addEventListener('input',e=>{const t2=e.target;if(t2.id==='csearch')drawPanel();if(t2.hasAttribute('data-pv')){const g=i=>($('#i_'+i)||{}).value||'';$('#insprev').innerHTML=`<b>${esc(g('co')||'Insurer')}</b><div class="sub">${esc(g('no')||'Policy number')} · ${esc(g('mem')||S.name)} · ${g('exp')||'Expiry date'}</div>`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();$('#pop').classList.remove('open')}if(e.key==='Enter'&&e.target.id==='chatin')A.send()});
render();
</script></body></html>
